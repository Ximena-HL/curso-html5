<!DOCTYPE html>

<!-- Fig. 5.1: sombratexto.html -->
<!-- Sombra de texto en CSS3. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Sombra de texto</title>
      <style type="text/css">
         h1
         {
            text-shadow: -4px 4px 6px dimgrey; /* agrega sombra */
            font-size: 400%; /* aumenta el tamaño de la fuente */
         }
      </style>
   </head>
   <body>
      <h1>Sombra de texto</h1>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejemplos</button>
         </a>
      </p>
   </body>
</html>
