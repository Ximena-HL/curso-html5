<!DOCTYPE html>

<!-- Fig. 5.14: fusionarimagenes.html -->
<!-- Fusionar una imagen en otra mediante CSS3. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Fusi&oacute;n de im&aacute;genes</title>
      <style type="text/css">
         #portada
         {
            position: relative;
            margin: 0 auto;
            width: 138px;
            height: 180px;
         }
         #portada img
         {
            position: absolute;
            left: 0;
            top: 0;
            width: 138px;
            height: 180px;
            -webkit-transition: opacity 4s ease-in-out;
            transition: opacity 4s ease-in-out;
         }
         #portada img.top:hover
         {
            opacity: 0;
         }
      </style>
   </head>
   <body>
      <div id="portada">
         <img class="bottom" src="../Imagenes/jhtp.png" alt="Portada de Java 9e">
         <img class="top" src="../Imagenes/jhtp8.png" alt="Portada de Java 8e">
      </div>

      <br><br>
      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejemplos</button>
         </a>
      </p>
   </body>
</html>
