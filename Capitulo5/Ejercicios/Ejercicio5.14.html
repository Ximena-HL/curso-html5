<!DOCTYPE html>
<!-- Ejercicio 5.14: ejercicio5_14.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 5.14 - Escala en Hover</title>
      <style type="text/css">
         .contenedor
         {
            display: flex;
            gap: 30px;
            padding: 40px;
         }
         .contenedor img
         {
            width: 100px;
            height: 130px;
            transition: transform 0.4s ease;
         }
         .contenedor img:hover
         {
            transform: scale(1.2); 
         }
      </style>
   </head>
   <body>
      <div class="contenedor">
         <img src="../Imagenes/paisaje1.png" alt="1">
         <img src="../Imagenes/paisaje2.png" alt="2">
         <img src="../Imagenes/paisaje3.png" alt="3">
         <img src="../Imagenes/paisaje4.png" alt="4">
      </div>
      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar</button></a></p>
   </body>
</html>
