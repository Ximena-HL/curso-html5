<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 5.6 - Box Shadow</title>
      <style type="text/css">
         .caja
         {
            width: 200px;
            height: 200px;
            display: inline-block;
            margin: 30px;
            font-family: sans-serif;
            text-align: center;
            line-height: 200px;
         }
         #caja1
         {
            background-color: #ffd166;
            box-shadow: 15px 15px 20px dimgrey;
         }
         #caja2
         {
            background-color: #06d6a0;
            box-shadow: -15px -15px 30px dimgrey;
         }
         #caja3
         {
            background-color: #118ab2;
            box-shadow: 15px 15px 10px dimgrey;
         }
      </style>
   </head>
   <body>
      <div id="caja1" class="caja">Caja 1</div>
      <div id="caja2" class="caja">Caja 2</div>
      <div id="caja3" class="caja">Caja 3</div>
      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar</button></a></p>
   </body>
</html>
