<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 5.10 - Inclinación alternada</title>
      <style type="text/css">
         .caja
         {
            margin: 80px;
            background: lightgreen;
            height: 100px;
            width: 220px;
            padding: 20px 0;
            text-align: center;
            font-size: 150%;
            border: 3px solid DarkGreen;
            border-radius: 15px;
            animation: inclinacion 4s infinite ease-in-out;
         }
         @keyframes inclinacion
         {
            0%   { transform: skew(0deg, 0deg); }
            25%  { transform: skew(0deg, 30deg); }  
            50%  { transform: skew(0deg, 0deg); }
            75%  { transform: skew(30deg, 0deg); } 
            100% { transform: skew(0deg, 0deg); }
         }
      </style>
   </head>
   <body>
      <div class="caja">Inclinación alternada</div>
      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar</button></a></p>
   </body>
</html>
