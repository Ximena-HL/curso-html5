<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 5.9 - Patrón cuadrado</title>
      <style type="text/css">
         #caja
         {
            position: relative;
            width: 80px;
            height: 80px;
            background-color: crimson;
            border-radius: 8px;
            animation: cuadrado 4s infinite linear;
         }
         @keyframes cuadrado
         {
            0%   { top: 0px;   left: 0px; }
            25%  { top: 0px;   left: 200px; }
            50%  { top: 200px; left: 200px; }
            75%  { top: 200px; left: 0px; }
            100% { top: 0px;   left: 0px; }
         }
      </style>
   </head>
   <body>
      <div style="height: 300px; width: 300px; position: relative;">
         <div id="caja"></div>
      </div>
      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar</button></a></p>
   </body>
</html>
