<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 5.5 - Esquinas redondeadas</title>
      <style type="text/css">
         .caja
         {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 15px;
            font-family: sans-serif;
         }
         #caja1
         {
            background-color: lightcoral;
            border-radius: 10px;
         }
         #caja2
         {
            background-color: lightseagreen;
            border-radius: 50px;
         }
         #caja3
         {
            background-color: lightsalmon;
            border-radius: 100px;
         }
      </style>
   </head>
   <body>
      <div id="caja1" class="caja"><b>10px</b></div>
      <div id="caja2" class="caja"><b>50px</b></div>
      <div id="caja3" class="caja"><b>100px</b></div>
      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar</button></a></p>
   </body>
</html>
