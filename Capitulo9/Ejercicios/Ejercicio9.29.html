<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.29</title>
      <script>
         // Relación recursiva: potencia(base, exp) = base * potencia(base, exp - 1)
         function potencia( base, exponente )
         {
            if ( exponente === 1 )
               return base;
            else
               return base * potencia( base, exponente - 1 );
         }

         function calcular()
         {
            var b = parseInt( document.getElementById( "base" ).value );
            var e = parseInt( document.getElementById( "exponente" ).value );

            if ( !isNaN( b ) && !isNaN( e ) && e >= 1 )
            {
               var res = potencia( b, e );
               document.getElementById( "resultado" ).innerHTML =
                  b + "<sup>" + e + "</sup> = <strong>" + res + "</strong>";
            }
            else
            {
               document.getElementById( "resultado" ).innerHTML =
                  "Introduzca enteros válidos (el exponente debe ser >= 1).";
            }
         }

         function iniciar()
         {
            document.getElementById( "btnCalcular" ).addEventListener( "click", calcular, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h1>Ejercicio 9.29: Potencia Recursiva</h1>
      <hr>

      <form action="#" onsubmit="return false;">
         <label for="base">Base:</label>
         <input type="number" id="base">
         <label for="exponente">Exponente (&ge; 1):</label>
         <input type="number" id="exponente" min="1" value="1">
         <input type="button" id="btnCalcular" value="Calcular con Recursividad">
      </form>

      <p id="resultado"></p>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
