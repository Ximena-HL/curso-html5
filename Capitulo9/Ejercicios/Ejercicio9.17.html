<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.17</title>
      <script>
         // a) Fahrenheit a Celsius: C = 5/9 * (F - 32)
         function celsius( f )
         {
            return ( 5.0 / 9.0 ) * ( f - 32.0 );
         }

         // b) Celsius a Fahrenheit: F = 9/5 * C + 32
         function fahrenheit( c )
         {
            return ( 9.0 / 5.0 ) * c + 32.0;
         }

         function convertirACelsius()
         {
            var valor = parseFloat( document.getElementById( "temperatura" ).value );
            if ( !isNaN( valor ) )
            {
               var resultado = celsius( valor );
               document.getElementById( "resultado" ).innerHTML =
                  valor + " °F equivale a <strong>" + resultado.toFixed( 2 ) + " °C</strong>";
            }
         }

         function convertirAFahrenheit()
         {
            var valor = parseFloat( document.getElementById( "temperatura" ).value );
            if ( !isNaN( valor ) )
            {
               var resultado = fahrenheit( valor );
               document.getElementById( "resultado" ).innerHTML =
                  valor + " °C equivale a <strong>" + resultado.toFixed( 2 ) + " °F</strong>";
            }
         }

         function iniciar()
         {
            document.getElementById( "btnCelsius" ).addEventListener( "click", convertirACelsius, false );
            document.getElementById( "btnFahrenheit" ).addEventListener( "click", convertirAFahrenheit, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h1>Ejercicio 9.17: Conversor de Temperatura</h1>
      <hr>

      <form action="#">
         <label for="temperatura">Temperatura:</label>
         <input type="number" id="temperatura" step="any">
         <br><br>
         <input type="button" id="btnCelsius" value="Convertir de Fahrenheit a Celsius">
         <input type="button" id="btnFahrenheit" value="Convertir de Celsius a Fahrenheit">
      </form>

      <p id="resultado"></p>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
