<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.26</title>
      <script>
         var numeroSecreto;
         var conteoIntentos;

         function iniciarJuego()
         {
            numeroSecreto = Math.floor( 1 + Math.random() * 1000 );
            conteoIntentos = 0;
            document.getElementById( "indicador" ).innerHTML = "Adivine un número entre 1 y 1000:";
            document.getElementById( "mensaje" ).innerHTML = "";
            document.getElementById( "intento" ).value = "";
            document.getElementById( "intento" ).disabled = false;
            document.getElementById( "btnAdivinar" ).disabled = false;
            document.getElementById( "intento" ).focus();
         }

         function comprobarIntento()
         {
            var campo = document.getElementById( "intento" );
            var intento = parseInt( campo.value );

            if ( isNaN( intento ) ) return;

            ++conteoIntentos;

            if ( intento === numeroSecreto )
            {
               var evaluacion = "";
               if ( conteoIntentos < 10 )
                  evaluacion = "¡O bien conoce el secreto o tuvo suerte! (Logrado en " + conteoIntentos + " intentos)";
               else if ( conteoIntentos === 10 )
                  evaluacion = "¡Ah, ya conoce el secreto! (Logrado exactamente en 10 intentos)";
               else
                  evaluacion = "¡Debería poder hacerlo mejor! (Le tomó " + conteoIntentos + " intentos; con búsqueda binaria se logra en 10 o menos)";

               document.getElementById( "mensaje" ).innerHTML =
                  "<strong style='color: green;'>¡Felicidades! ¡Adivinó el número!</strong><br>" +
                  "<p>" + evaluacion + "</p>" +
                  "<input type='button' value='Jugar de nuevo' onclick='iniciarJuego()'>";

               campo.value = "";
               campo.disabled = true;
               document.getElementById( "btnAdivinar" ).disabled = true;
            }
            else if ( intento < numeroSecreto )
            {
               document.getElementById( "mensaje" ).innerHTML = "Demasiado bajo. Intente de nuevo. (Intentos: " + conteoIntentos + ")";
               campo.value = "";
               campo.focus();
            }
            else
            {
               document.getElementById( "mensaje" ).innerHTML = "Demasiado alto. Intente de nuevo. (Intentos: " + conteoIntentos + ")";
               campo.value = "";
               campo.focus();
            }
         }

         function iniciar()
         {
            iniciarJuego();
            document.getElementById( "btnAdivinar" ).addEventListener( "click", comprobarIntento, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h1>Ejercicio 9.26: Adivinar el número con conteo de intentos</h1>
      <hr>

      <p id="indicador"></p>
      <form action="#" onsubmit="return false;">
         <input type="number" id="intento" min="1" max="1000">
         <input type="button" id="btnAdivinar" value="Enviar intento">
      </form>
      <div id="mensaje"></div>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
