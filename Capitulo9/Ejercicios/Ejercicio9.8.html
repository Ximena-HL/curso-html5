<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.8</title>
      <script>
         var totalAyer = 0.0;

         function procesarCliente()
         {
            var campoHoras = document.getElementById( "horas" );
            var horas = parseFloat( campoHoras.value );

            if ( !isNaN( horas ) && horas > 0 && horas <= 24 )
            {
               var cargoActual = calcularCargos( horas );
               totalAyer += cargoActual;

               document.getElementById( "cargoCliente" ).innerHTML =
                  "Cargo por " + horas + " hora(s): <strong>$" + cargoActual.toFixed( 2 ) + "</strong>";
               document.getElementById( "totalAcumulado" ).innerHTML =
                  "Total acumulado de recibos: <strong>$" + totalAyer.toFixed( 2 ) + "</strong>";

               campoHoras.value = "";
               campoHoras.focus();
            }
            else
            {
               alert( "Ingrese una cantidad válida de horas entre 0 y 24." );
            }
         }

         function calcularCargos( h )
         {
            var cargo = 2.00;

            if ( h > 3.0 )
            {
               // Math.ceil para cobrar cualquier fracción de hora adicional
               cargo += Math.ceil( h - 3.0 ) * 0.50;
            }

            if ( cargo > 10.00 )
               cargo = 10.00;

            return cargo;
         }

         function iniciar()
         {
            var boton = document.getElementById( "btnCalcular" );
            boton.addEventListener( "click", procesarCliente, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h1>Ejercicio 9.8: Cargos de Estacionamiento</h1>
      <hr>

      <form action="#">
         <label for="horas">Horas estacionado (m&aacute;ximo 24):</label>
         <input type="number" id="horas" step="any" min="0" max="24">
         <input type="button" id="btnCalcular" value="Calcular Cargo">
      </form>

      <p id="cargoCliente"></p>
      <p id="totalAcumulado"></p>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
