         Un jugador tira dos dados. Si la suma es 7 u 11 en el primer lanzamiento, gana.
         Si la suma es 2, 3 o 12 (craps), pierde. Si es 4, 5, 6, 8, 9 o 10, esa suma
         se convierte en su punto. Para ganar, debe seguir tirando hasta obtener su punto
         nuevamente. Si saca un 7 antes de lograrlo, pierde.
