<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Simulación del juego de Craps</title>
      <style>
         p.rojo { color: red; font-weight: bold; }
         img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin: 2px;
         }
         div {
            border: 5px ridge royalblue;
            padding: 10px;
            width: 130px;
            margin-bottom: 10px;
         }
         .punto { margin: 0px 0px 5px 0px; font-weight: bold; }
      </style>
      <script>
         var puntoDado1Img;
         var puntoDado2Img;
         var tiroDado1Img;
         var tiroDado2Img;
         var mensajes;
         var botonJugar;
         var botonTirar;
         var tirodados;

         var miPunto;
         var valorDado1;
         var valorDado2;

         function iniciarJuego()
         {
            tirodados = document.getElementById( "tirodados" );
            puntoDado1Img = document.getElementById( "puntoDado1" );
            puntoDado2Img = document.getElementById( "puntoDado2" );
            tiroDado1Img = document.getElementById( "tiroDado1" );
            tiroDado2Img = document.getElementById( "tiroDado2" );
            mensajes = document.getElementById( "mensajes" );
            botonJugar = document.getElementById( "jugar" );
            botonTirar = document.getElementById( "tirar" );

            botonTirar.disabled = true;
            establecerImagen( puntoDado1Img );
            establecerImagen( puntoDado2Img );
            establecerImagen( tiroDado1Img );
            establecerImagen( tiroDado2Img );

            miPunto = 0;
            primerTiro();
         }

         function primerTiro()
         {
            var sumaDeDados = tirarDados();

            switch ( sumaDeDados )
            {
               case 7:
               case 11:
                  mensajes.innerHTML = "¡Ha ganado! Haga clic en Jugar para jugar de nuevo.";
                  break;
               case 2:
               case 3:
               case 12:
                  mensajes.innerHTML = "Lo siento. Usted pierde. Haga clic en Jugar para jugar de nuevo.";
                  break;
               default:
                  miPunto = sumaDeDados;
                  establecerImagen( puntoDado1Img, valorDado1 );
                  establecerImagen( puntoDado2Img, valorDado2 );
                  mensajes.innerHTML = "Tire de nuevo";
                  botonTirar.disabled = false;
                  botonJugar.disabled = true;
                  break;
            }
         }

         function tirarDeNuevo()
         {
            var sumaDeDados = tirarDados();

            if ( sumaDeDados == miPunto )
            {
               mensajes.innerHTML = "¡Ha ganado! Haga clic en Jugar para jugar de nuevo.";
               botonTirar.disabled = true;
               botonJugar.disabled = false;
            }
            else if ( sumaDeDados == 7 )
            {
               mensajes.innerHTML = "Lo siento. Usted pierde. Haga clic en Jugar para jugar de nuevo.";
               botonTirar.disabled = true;
               botonJugar.disabled = false;
            }
         }

         function tirarDados()
         {
            tirodados.play();

            valorDado1 = NaN;
            valorDado2 = NaN;
            mostrarDados();

            valorDado1 = Math.floor( 1 + Math.random() * 6 );
            valorDado2 = Math.floor( 1 + Math.random() * 6 );
            return valorDado1 + valorDado2;
         }

         function mostrarDados()
         {
            establecerImagen( tiroDado1Img, valorDado1 );
            establecerImagen( tiroDado2Img, valorDado2 );
         }

         function establecerImagen( imgDado, valorDado )
         {
            if ( isFinite( valorDado ) )
               imgDado.src = "../Imagenes/dado" + valorDado + ".png";
            else
               imgDado.src = "../Imagenes/blanco.png";
         }

         function iniciar()
         {
            var btnJugar = document.getElementById( "jugar" );
            btnJugar.addEventListener( "click", iniciarJuego, false );

            var btnTirar = document.getElementById( "tirar" );
            btnTirar.addEventListener( "click", tirarDeNuevo, false );

            var audioDados = document.getElementById( "tirodados" );
            audioDados.addEventListener( "ended", mostrarDados, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <audio id="tirodados" preload="auto">
         <source src="http://test.deitel.com/dicerolling.mp3" type="audio/mpeg">
         <source src="http://test.deitel.com/dicerolling.ogg" type="audio/ogg">
         El navegador no soporta la etiqueta de audio.
      </audio>

      <p><a href="Ejemplo9.8.html">Haga clic aquí para consultar las reglas de Craps</a></p>

      <div id="puntoDiv">
         <p class="punto">El punto es:</p>
         <img id="puntoDado1" src="../Imagenes/blanco.png" alt="Dado 1 de punto">
         <img id="puntoDado2" src="../Imagenes/blanco.png" alt="Dado 2 de punto">
      </div>

      <div class="tiroDiv">
         <img id="tiroDado1" src="../Imagenes/blanco.png" alt="Dado 1 de tiro">
         <img id="tiroDado2" src="../Imagenes/blanco.png" alt="Dado 2 de tiro">
      </div>

      <form action="#">
         <input id="jugar" type="button" value="Jugar">
         <input id="tirar" type="button" value="Tirar">
      </form>

      <p id="mensajes" class="rojo">Haga clic en Jugar para iniciar el juego</p>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejemplos</button>
         </a>
      </p>
   </body>
</html>
