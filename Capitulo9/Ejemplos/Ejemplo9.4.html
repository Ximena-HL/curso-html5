<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <title>Desplazar y escalar enteros aleatorios</title>
      <style>
         p, ol { margin: 0; }
         li    { display: inline; margin-right: 10px; }
      </style>
      <script>
         var valor;

         document.writeln( "<p>Números aleatorios generados:</p><ol>" );

         // Genera 30 valores en el rango [1, 6]
         for ( var i = 1; i <= 30; ++i )
         {
            valor = Math.floor( 1 + Math.random() * 6 );
            document.writeln( "<li>" + valor + "</li>" );
         }

         document.writeln( "</ol>" );
      </script>
   </head>
   <body>
      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejemplos</button>
         </a>
      </p>
   </body>
</html>
