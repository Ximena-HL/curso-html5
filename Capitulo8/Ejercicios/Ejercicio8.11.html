<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.11</title>
   </head>
   <body>
      <h1>Ejercicio 8.11: Ventas del Vendedor Minorista</h1>
      <hr>

      <script>
         var totalVentas = 0;
         var totalP1 = 0, totalP2 = 0, totalP3 = 0, totalP4 = 0, totalP5 = 0;

         var entradaProducto = window.prompt(
            "Ingrese el número de producto (1 al 5) o -1 para finalizar:", "1" );
         var producto = parseInt( entradaProducto );

         while ( producto !== -1 )
         {
            var cantidad = parseInt( window.prompt( "Ingrese la cantidad vendida:", "1" ) );

            switch ( producto )
            {
               case 1:
                  totalP1 += 2.98 * cantidad;
                  break;
               case 2:
                  totalP2 += 4.50 * cantidad;
                  break;
               case 3:
                  totalP3 += 9.98 * cantidad;
                  break;
               case 4:
                  totalP4 += 4.49 * cantidad;
                  break;
               case 5:
                  totalP5 += 6.87 * cantidad;
                  break;
               default:
                  window.alert( "Número de producto inválido. Debe ser del 1 al 5." );
                  break;
            }

            entradaProducto = window.prompt(
               "Ingrese el número de producto (1 al 5) o -1 para finalizar:", "1" );
            producto = parseInt( entradaProducto );
         }

         totalVentas = totalP1 + totalP2 + totalP3 + totalP4 + totalP5;

         document.writeln( "<h3>Resumen de ventas por producto:</h3>" );
         document.writeln( "<ul>" );
         document.writeln( "<li>Producto 1 ($2.98 c/u): $" + totalP1.toFixed(2) + "</li>" );
         document.writeln( "<li>Producto 2 ($4.50 c/u): $" + totalP2.toFixed(2) + "</li>" );
         document.writeln( "<li>Producto 3 ($9.98 c/u): $" + totalP3.toFixed(2) + "</li>" );
         document.writeln( "<li>Producto 4 ($4.49 c/u): $" + totalP4.toFixed(2) + "</li>" );
         document.writeln( "<li>Producto 5 ($6.87 c/u): $" + totalP5.toFixed(2) + "</li>" );
         document.writeln( "</ul>" );
         document.writeln( "<h2>Total de ventas en la semana: $" + totalVentas.toFixed(2) + "</h2>" );
      </script>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
