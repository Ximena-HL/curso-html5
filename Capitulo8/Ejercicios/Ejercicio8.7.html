<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.7</title>
   </head>
   <body>
      <h1>Ejercicio 8.7: Producto de enteros impares del 1 al 15</h1>
      <hr>

      <script>
         var producto = 1;

         for ( var i = 1; i <= 15; i += 2 )
            producto *= i;

         document.writeln( "<p>Cálculo: 1 &times; 3 &times; 5 &times; 7 &times; 9 &times; 11 &times; 13 &times; 15</p>" );
         document.writeln( "<h2>El producto es: " + producto + "</h2>" );
      </script>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
