<!DOCTYPE html>

<!-- Fig. 8.5: Suma.html -->
<!-- Suma con la estructura de repetición for. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Sumar los enteros pares del 2 al 100</title>
      <script>

         var suma = 0;

         for ( var numero = 2; numero <= 100; numero += 2 )
            suma += numero;

         document.writeln( "La suma de los enteros pares " +
            "del 2 al 100 es " + suma );

      </script>
   </head>
   <body>
      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejemplos</button>
         </a>
      </p>
   </body>
</html>
