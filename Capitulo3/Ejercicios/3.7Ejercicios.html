<!DOCTYPE html>

<html>
   <head>
      <meta charset="utf-8">
      <title>3.7Ejercicios</title>
   </head>

   <body>
      <h1>Ejercicio 3.7: Formulario de b&uacute;squeda con autocomplete</h1>
      <p>Introduzca una consulta de b&uacute;squeda para probar el autocompletado del navegador:</p>

      <form method="get" autocomplete="on">
         <p>
            <label for="consulta">Buscar:</label>
            <input type="search" id="consulta" name="q" placeholder="Escriba su b&uacute;squeda" autofocus required />
         </p>

         <p>
            <input type="submit" value="Buscar" />
            <input type="reset" value="Limpiar" />
         </p>
      </form>

      <hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
