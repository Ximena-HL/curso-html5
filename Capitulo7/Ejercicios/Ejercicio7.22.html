<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.22</title>
   </head>
   <body>
      <h1>Ejercicio 7.22: Cifrado de Datos</h1>
      <hr>

      <script>
         var entrada = window.prompt("Ingrese un entero de 4 dígitos para cifrar:");
         var num = parseInt(entrada);

         // Separar dígitos
         var d1 = Math.floor(num / 1000);
         var d2 = Math.floor((num % 1000) / 100);
         var d3 = Math.floor((num % 100) / 10);
         var d4 = num % 10;

         // Cifrar sumando 7 y aplicando módulo 10
         var c1 = (d1 + 7) % 10;
         var c2 = (d2 + 7) % 10;
         var c3 = (d3 + 7) % 10;
         var c4 = (d4 + 7) % 10;

         // Intercambiar 1 con 3, y 2 con 4
         var cifrado = "" + c3 + c4 + c1 + c2;

         document.writeln("<p>Número original: <strong>" + entrada + "</strong></p>");
         document.writeln("<h2>Número cifrado: " + cifrado + "</h2>");
      </script>

      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar a Ejercicios</button></a></p>
   </body>
</html>
