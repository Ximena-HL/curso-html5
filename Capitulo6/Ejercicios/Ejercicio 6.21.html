<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.21</title>
   </head>
   <body>
      <h1>Ejercicio 6.21: Par o Impar</h1>
      <hr>

      <script>
         var entrada = window.prompt("Escriba un número entero:");
         var numero = parseInt(entrada);

         if (numero % 2 == 0) {
            document.writeln("<p>El número <strong>" + numero + "</strong> es <strong>PAR</strong>.</p>");
         }
         if (numero % 2 != 0) {
            document.writeln("<p>El número <strong>" + numero + "</strong> es <strong>IMPAR</strong>.</p>");
         }
      </script>

      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar a Ejercicios</button></a></p>
   </body>
</html>
