<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.24</title>
      <style>
         table {
            border-collapse: collapse;
            text-align: center;
         }
         table, th, td {
            border: 1px solid black;
            padding: 6px 20px;
         }
      </style>
   </head>
   <body>
      <h1>Ejercicio 6.24: Tabla de cuadrados y cubos</h1>
      <hr>

      <script>
         document.writeln("<table>");
         document.writeln("<tr><th>número</th><th>cuadrado</th><th>cubo</th></tr>");

         // Generación de filas del 0 al 5
         for (var i = 0; i <= 5; i++) {
            document.writeln("<tr><td>" + i + "</td><td>" + (i * i) + "</td><td>" + (i * i * i) + "</td></tr>");
         }

         document.writeln("</table>");
      </script>

      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar a Ejercicios</button></a></p>
   </body>
</html>
