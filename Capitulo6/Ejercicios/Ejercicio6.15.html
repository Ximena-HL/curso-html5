<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.15</title>
   </head>
   <body>
      <h1>Ejercicio 6.15: Mostrar números del 1 al 4</h1>
      <hr>

      <h3>Inciso a) Usando una instrucción document.writeln:</h3>
      <script>
         document.writeln("<p>1 2 3 4</p>");
      </script>

      <h3>Inciso b) Usando cuatro instrucciones document.write:</h3>
      <p>
      <script>
         document.write("1 ");
         document.write("2 ");
         document.write("3 ");
         document.write("4");
      </script>
      </p>

      <hr>
      <p><a href="index.html"><button type="button">&larr; Regresar a Ejercicios</button></a></p>
   </body>
</html>
