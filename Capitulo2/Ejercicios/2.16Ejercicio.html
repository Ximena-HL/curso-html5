<!DOCTYPE html>

<!-- Una universidad local le pidió que creara un documento de HTML5 que permita a los futuros estudiantes universitarios
proveer retroalimentación sobre su visita al campus. Su documento de HTML5 debe contener un formubrio
con campos de texto para un nombre y un conro electrónico. Proporcione casillas de verificación que permitan a los
futuros estudiantes indicar lo que les gustó mis sobre el campus. Las casillas de verificación deben incluir campus, estudiantes, ubicación, ambiente, dormitorios y deportes. Proporcione además botones de opción que pregunten a
ios futuros estudiantes cómo supieron sobre la universidad. Las opciones deben incluir, amigos, televisión, Internet
y otro. Además, proporcione un área de texto para comentarios adicionales, un botón para enviar y un botón para
restablecer. Use post para enviar la información en d formulario a h ttp ://www.deitel.com. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Retroalimentaci&oacute;n de la visita al campus</title>
   </head>

   <body>
      <h1>Formulario de retroalimentaci&oacute;n del campus</h1>
      <p>Por favor, complete este formulario para compartir su opini&oacute;n sobre la visita:</p>

      <form method="post" action="http://www.deitel.com">

         <p>
            <label>Nombre:
               <input name="nombre" type="text" size="30" maxlength="40">
            </label>
         </p>

         <p>
            <label>Correo electr&oacute;nico:
               <input name="correo" type="text" size="30" maxlength="50">
            </label>
         </p>

         <p>
            <strong>&iquest;Qu&eacute; le gust&oacute; m&aacute;s sobre el campus?</strong><br>

            <label>Campus
               <input name="gustos" type="checkbox" value="Campus"></label>
            <label>Estudiantes
               <input name="gustos" type="checkbox" value="Estudiantes"></label>
            <label>Ubicaci&oacute;n
               <input name="gustos" type="checkbox" value="Ubicacion"></label>
            <label>Ambiente
               <input name="gustos" type="checkbox" value="Ambiente"></label>
            <label>Deportes
               <input name="gustos" type="checkbox" value="Deportes"></label>
         </p>

         <p>
            <strong>&iquest;C&oacute;mo supo sobre la universidad?</strong><br>

            <label>Amigos
               <input name="origen" type="radio" value="amigos" checked></label>
            <label>Televisi&oacute;n
               <input name="origen" type="radio" value="television"></label>
            <label>Internet
               <input name="origen" type="radio" value="internet"></label>
            <label>Otro
               <input name="origen" type="radio" value="otro"></label>
         </p>

         <p>
            <label>Comentarios adicionales:<br>
               <textarea name="comentarios" rows="5" cols="40"></textarea>
            </label>
         </p>

         <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Restablecer">
         </p>

      </form>
   </body>
</html>
<hr>
      <p>
         <a href="index.html">
            <button type="button">&larr; Regresar a Ejercicios</button>
         </a>
      </p>
   </body>
</html>
