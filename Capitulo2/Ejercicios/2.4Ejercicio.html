<!DOCTYPE html>

<!-- Una imagen llamada deltel.png tiene 200 pixdcs de ancho y 150 píxeles de alto. Escriba una instrucción de
HTML5 usando los atributos wldth y height d d demento 1mg para realizar cada una de las siguientes transformaciones:
a) Aumentar d tamaño de la imagen en un 100 por ciento.
b) Aumentar d tamaño de la imagen en un 50 por ciento.
c) Cambiar la relación anchura-altura a 2:1 manteniendo d valor de wldth que se obtuvo en d inciso (a). -->

<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 2.4</title>
   </head>

   <body>
      <p>Original (200x150):<br>
         <img src="../imagenes/deitel.png" width="200" height="150" alt="Original">
      </p>

      <p>a. Aumento del 100% (400x300):<br>
         <img src="../imagenes/deitel.png" width="400" height="300" alt="Inciso a">
      </p>

      <p>b. Aumento del 50% (300x225):<br>
         <img src="../imagenes/deitel.png" width="300" height="225" alt="Inciso b">
      </p>

      <p>c. Relación 2:1 con ancho de (a) (400x200):<br>
         <img src="../imagenes/deitel.png" width="400" height="200" alt="Inciso c">
      </p>
   </body>
</html>
<hr>

</html>
